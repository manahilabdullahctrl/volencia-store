<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOLENCIA Admin Panel</title>

<link rel="stylesheet" href="../css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
<script src="../js/supabase.js"></script>

</head>

<body>

<script>
if(localStorage.getItem("admin")!=="true"){
window.location.href="login.html";
}
</script>

<header>

<div class="logo">
VOLENCIA ADMIN
</div>

<button onclick="logout()">
Logout
</button>

</header>

<section style="padding:20px;">

<h2>Add Product</h2>

<input
id="name"
type="text"
placeholder="Product Name">

<br><br>

<input
id="price"
type="number"
placeholder="Price">

<br><br>

<textarea
id="description"
placeholder="Product Description"
style="width:300px;height:120px;">
</textarea>

<br><br>

<h3>Upload Product Image</h3>

<button onclick="uploadImages()">
📷 Upload Image
</button>

<br><br>

<div
id="imgPreview"
style="display:flex;flex-wrap:wrap;gap:10px;">
</div>

<br>

<button
onclick="addProduct()"
style="background:green;color:white;padding:12px 20px;border:none;border-radius:6px;cursor:pointer;">
➕ Add Product
</button>

</section>

<hr>

<section style="padding:20px;">

<h2>Products List</h2>

<div id="adminList"></div>

</section>

<script>

let uploadedImages=[];

function uploadImages(){

uploadedImages=[];

cloudinary.openUploadWidget({

cloudName:"futxwwl3",

uploadPreset:"volencia",

sources:["local"],

multiple:true,

maxFiles:20,

folder:"volencia",

showAdvancedOptions:true

},
(error,result)=>{

if(!error && result.event==="success"){

uploadedImages.push(result.info.secure_url);

document.getElementById("imgPreview").innerHTML +=

`
<img src="${result.info.secure_url}"
width="90"
style="margin:5px;border-radius:8px;">
`;

}

});

}
async function addProduct(){

const name=document.getElementById("name").value.trim();

const price=document.getElementById("price").value.trim();

const description=document.getElementById("description").value.trim();

if(!name || !price || !description || uploadedImages.length===0){

alert("Please fill all fields and upload image");

return;

}

const { error } = await supabaseClient

.from("products")

.insert([{

name:name,

price:Number(price),

description:description,

image:uploadedImages[0],

images:uploadedImages

}]);


if(error){

console.log(error);

alert(error.message);

return;

}

alert("✅ Product Added Successfully");

clearForm();

loadProducts();

}



async function loadProducts(){

const box=document.getElementById("adminList");

const { data, error } = await supabaseClient

.from("products")

.select("*")

.order("created_at",{ascending:false});

if(error){

console.log(error);

alert(error.message);

return;

}

box.innerHTML="";

if(!data || data.length===0){

box.innerHTML="<h3>No Products Found</h3>";

return;

}

data.forEach(product=>{

box.innerHTML+=`

<div class="card">

<img
src="${product.image}"
width="120"
style="border-radius:8px;">

<h3>${product.name}</h3>

<p>${product.description}</p>

<p><b>Rs ${product.price}</b></p>

<button
onclick="deleteProduct('${product.id}')"
style="background:red;color:white;padding:8px 15px;border:none;border-radius:6px;cursor:pointer;">

❌ Delete

</button>

</div>

`;

});

}async function deleteProduct(id){

if(!confirm("Delete this product?")){
return;
}

const { error } = await supabaseClient

.from("products")

.delete()

.eq("id", id);

if(error){

console.log(error);

alert(error.message);

return;

}

alert("✅ Product Deleted");

loadProducts();

}



function clearForm(){

document.getElementById("name").value="";

document.getElementById("price").value="";

document.getElementById("description").value="";

document.getElementById("imgPreview").innerHTML="";

uploadedImages=[];

}



function logout(){

localStorage.removeItem("admin");

window.location.href="login.html";

}



window.onload=function(){

loadProducts();

};

</script>
</body>

</html>
